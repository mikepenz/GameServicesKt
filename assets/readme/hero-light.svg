<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">GameServicesKt</title>
  <desc id="desc">Shared Kotlin game-service contracts connect your game to explicit Google Play Games and Game Center backends. Available operations vary by backend.</desc>
  <rect width="1200" height="420" rx="24" fill="#FEF7FF"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="56" y="55" font-size="22" letter-spacing="3" fill="#625B71">KOTLIN MULTIPLATFORM</text>
    <text x="52" y="139" font-size="80" font-weight="700" fill="#211C2B">GameServicesKt</text>
    <text x="56" y="189" font-size="30" fill="#625B71">Achievements. Leaderboards. Saved games. Friends.</text>
    <g fill="none" stroke="#6750A4" stroke-width="3">
      <path d="M326 298 H402 M766 298 H818 V266 H858 M818 298 V346 H858"/>
    </g>
    <rect x="56" y="260" width="270" height="76" rx="12" fill="#EADDFF"/>
    <text x="191" y="307" text-anchor="middle" font-size="29" font-weight="600" fill="#211C2B">Your game</text>
    <rect x="402" y="260" width="364" height="76" rx="12" fill="#6750A4"/>
    <text x="584" y="307" text-anchor="middle" font-size="29" font-weight="600" fill="#FEF7FF">Shared Kotlin API</text>
    <text x="876" y="275" font-size="28" font-weight="600" fill="#211C2B">Google Play Games</text>
    <text x="876" y="355" font-size="28" font-weight="600" fill="#211C2B">Game Center</text>
    <text x="56" y="389" font-size="20" fill="#625B71">Explicit backends · Capabilities per operation · Suspend functions returning Result</text>
  </g>
</svg>
